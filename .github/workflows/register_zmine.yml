name: ZMine Register Accounts

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Dependencies
        run: |
          pip install playwright groq
          playwright install chromium --with-deps

      - name: Ensure accounts file exists
        run: |
          if [ ! -f zmine_accounts.jsonl ]; then
            touch zmine_accounts.jsonl
            echo "Created empty zmine_accounts.jsonl"
          else
            echo "zmine_accounts.jsonl has $(wc -l < zmine_accounts.jsonl) entries"
          fi

      - name: Run Full Flow
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python register_zmine.py

      - name: Commit New Account
        run: |
          git config --global user.name "ZMine Bot"
          git config --global user.email "bot@example.com"
          git add zmine_accounts.jsonl
          git diff --quiet && git diff --staged --quiet || (git commit -m "Backup new zmine account [skip ci]" && git push)
        continue-on-error: true
