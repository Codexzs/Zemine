name: ZMine Daily Farming

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  farm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Daily Farming
        run: python daily_login_zmine.py

      - name: Commit Farm Log to GitHub
        run: |
          git config --global user.name "ZMine Bot"
          git config --global user.email "bot@example.com"
          git add zmine_accounts.jsonl
          git diff --quiet && git diff --staged --quiet || (git commit -m "Farm log update [skip ci]" && git push)
        continue-on-error: true
